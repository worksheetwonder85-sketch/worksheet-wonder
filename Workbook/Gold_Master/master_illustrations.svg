      <rect x="5" y="5" width="90" height="90" rx="16" fill="#F8FAFC" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8 8" />
      <!-- Giant Hand/Finger Icon -->
      <path d="M 40 70 L 40 40 C 40 35, 48 35, 48 40 L 48 45 L 50 45 C 50 40, 58 40, 58 45 L 58 48 C 65 45, 70 50, 68 55 L 60 70 Z" fill="#93C5FD" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" />
