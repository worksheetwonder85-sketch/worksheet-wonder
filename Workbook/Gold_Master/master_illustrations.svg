      <!-- Landscape Icon -->
      <circle cx="70" cy="30" r="12" fill="#E2E8F0" />
      <path d="M 15 85 L 45 45 L 65 70 L 75 55 L 90 85 Z" fill="#CBD5E1" />
    </g>

    <!-- FINGER TRACE PLACEHOLDER (Oversized Box) -->
