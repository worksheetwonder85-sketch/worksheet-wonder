    </g>

    <!-- COLOURING ACTIVITY PLACEHOLDER -->
    <!-- Viewbox 0 0 150 150 -->
    <g id="placeholder-coloring">
      <rect x="5" y="5" width="140" height="140" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="4" stroke-dasharray="10 10" />
      <!-- Crayon Icon -->
      <path d="M 40 100 L 110 30 L 120 40 L 50 110 Z" fill="none" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
