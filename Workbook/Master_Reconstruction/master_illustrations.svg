<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    
    <!-- BRAND PLACEHOLDER -->
    <g id="brand-logo-placeholder">
      <rect width="24" height="24" rx="4" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="2 2" />
      <text x="12" y="16" font-family="sans-serif" font-size="8" font-weight="bold" fill="#757575" text-anchor="middle">LOGO</text>
    </g>

    <!-- ROAD TRACK UPPERCASE A (Original Design) -->
    <g id="road-track-upper-a">
      <!-- Outer Track Outline -->
      <path d="M 40 10 L 15 85" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 40 10 L 65 85" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 25 55 L 55 55" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Inner Road Surface -->
      <path d="M 40 10 L 15 85" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 40 10 L 65 85" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 25 55 L 55 55" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Dashed Yellow Center Lines -->
      <path d="M 40 10 L 15 85" fill="none" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" />
      <path d="M 40 10 L 65 85" fill="none" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" />
      <path d="M 25 55 L 55 55" fill="none" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" />
      <!-- Start Dot -->
      <circle cx="40" cy="10" r="4.5" fill="#FF7043" stroke="#2C3E50" stroke-width="1.5" />
    </g>

    <!-- ROAD TRACK LOWERCASE a (Original Design) -->
    <g id="road-track-lower-a">
      <path d="M 60 25 L 60 75" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" />
      <circle cx="40" cy="55" r="20" fill="none" stroke="#2C3E50" stroke-width="8" />
      <path d="M 60 25 L 60 75" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round" />
      <circle cx="40" cy="55" r="20" fill="none" stroke="#78909C" stroke-width="6" />
      <path d="M 60 25 L 60 75" fill="none" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" />
      <circle cx="40" cy="55" r="20" fill="none" stroke="#FFEB3B" stroke-width="1.5" stroke-dasharray="4 4" />
      <circle cx="40" cy="35" r="4.5" fill="#FF7043" stroke="#2C3E50" stroke-width="1.5" />
    </g>

    <!-- PICNIC BASKET (Original Design) -->
    <g id="picnic-basket">
      <!-- Handle -->
      <path d="M 12 30 C 12 5, 52 5, 52 30" fill="none" stroke="#2C3E50" stroke-width="3" />
      <path d="M 16 30 C 16 10, 48 10, 48 30" fill="none" stroke="#2C3E50" stroke-width="3" />
      <!-- Basket Base -->
      <path d="M 8 30 L 56 30 L 48 55 L 16 55 Z" fill="#D7CCC8" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round" />
      <!-- Weave lines -->
      <line x1="13" y1="38" x2="51" y2="38" stroke="#2C3E50" stroke-width="2.5" opacity="0.5" />
      <line x1="15" y1="46" x2="49" y2="46" stroke="#2C3E50" stroke-width="2.5" opacity="0.5" />
      <line x1="24" y1="30" x2="24" y2="55" stroke="#2C3E50" stroke-width="2.5" opacity="0.5" />
      <line x1="40" y1="30" x2="40" y2="55" stroke="#2C3E50" stroke-width="2.5" opacity="0.5" />
      <!-- Blanket drape -->
      <path d="M 18 30 L 25 40 L 32 30 Z" fill="#EF5350" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 32 30 L 39 40 L 46 30 Z" fill="#EF5350" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- APPLE (Original Design) -->
    <g id="apple">
      <path d="M 32 55 C 10 55, 12 35, 12 25 C 12 15, 25 10, 32 18 C 39 10, 52 15, 52 25 C 52 35, 54 55, 32 55 Z" fill="#EF5350" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round" />
      <path d="M 32 18 C 32 18, 30 5, 40 5" fill="none" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" />
      <path d="M 40 5 C 40 5, 48 10, 42 16 Z" fill="#66BB6A" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round" />
      <path d="M 22 25 C 22 25, 20 35, 26 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- BANANA (Original Design) -->
    <g id="banana">
      <path d="M 15 20 C 30 10, 50 15, 55 45 C 55 45, 45 40, 35 45 C 20 50, 10 40, 15 20 Z" fill="#FFEB3B" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round" />
      <path d="M 15 20 L 10 15" fill="none" stroke="#8D6E63" stroke-width="3" stroke-linecap="round" />
      <path d="M 15 20 C 25 25, 45 28, 55 45" fill="none" stroke="#2C3E50" stroke-width="2.5" opacity="0.3" stroke-linecap="round" />
    </g>

    <!-- LADYBUG (Original Design) -->
    <g id="ladybug">
      <!-- Legs -->
      <path d="M 25 35 L 10 30 M 20 55 L 5 55 M 25 75 L 10 80" stroke="#2C3E50" stroke-width="4" stroke-linecap="round" />
      <path d="M 75 35 L 90 30 M 80 55 L 95 55 M 75 75 L 90 80" stroke="#2C3E50" stroke-width="4" stroke-linecap="round" />
      <!-- Body -->
      <circle cx="50" cy="55" r="35" fill="#EF5350" stroke="#2C3E50" stroke-width="3.5" />
      <!-- Head -->
      <circle cx="50" cy="22" r="14" fill="#2C3E50" />
      <!-- Antennae -->
      <path d="M 42 12 C 35 5, 30 15, 25 10" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
      <path d="M 58 12 C 65 5, 70 15, 75 10" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
      <circle cx="25" cy="10" r="3" fill="#2C3E50" />
      <circle cx="75" cy="10" r="3" fill="#2C3E50" />
      <!-- Eyes -->
      <circle cx="44" cy="20" r="4" fill="#ffffff" />
      <circle cx="56" cy="20" r="4" fill="#ffffff" />
      <circle cx="44" cy="20" r="1.5" fill="#2C3E50" />
      <circle cx="56" cy="20" r="1.5" fill="#2C3E50" />
      <!-- Wings Split -->
      <path d="M 50 20 L 50 90" fill="none" stroke="#2C3E50" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- ANT MASCOT (Original Design) -->
    <g id="ant-mascot">
      <!-- Body segments -->
      <circle cx="24" cy="40" r="8" fill="#42A5F5" stroke="#2C3E50" stroke-width="2.5" />
      <circle cx="36" cy="38" r="6" fill="#1E88E5" stroke="#2C3E50" stroke-width="2.5" />
      <circle cx="48" cy="44" r="10" fill="#1565C0" stroke="#2C3E50" stroke-width="2.5" />
      <!-- Legs -->
      <path d="M 24 48 L 20 60 M 24 48 L 28 60" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 36 44 L 34 58 M 36 44 L 40 58" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round" />
      <!-- Antennae -->
      <path d="M 20 34 C 15 25, 25 20, 15 15" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" />
      <path d="M 28 34 C 35 25, 25 20, 35 15" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" />
      <!-- Eyes -->
      <circle cx="20" cy="38" r="2.5" fill="#ffffff" stroke="#2C3E50" stroke-width="1.5" />
      <circle cx="28" cy="38" r="2.5" fill="#ffffff" stroke="#2C3E50" stroke-width="1.5" />
      <circle cx="19" cy="38" r="1" fill="#2C3E50" />
      <circle cx="27" cy="38" r="1" fill="#2C3E50" />
      <!-- Waving Arm -->
      <path d="M 36 38 C 30 25, 45 25, 40 18" fill="none" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round" />
    </g>

  </defs>
</svg>
