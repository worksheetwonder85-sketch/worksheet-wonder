<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Beach Ball Gradients -->
    <linearGradient id="ball-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="ball-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>
    <linearGradient id="ball-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </linearGradient>
    <linearGradient id="ball-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55E6C1"/>
      <stop offset="100%" stop-color="#1DD1A1"/>
    </linearGradient>
    <radialGradient id="ball-shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D3436" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2D3436" stop-opacity="0"/>
    </radialGradient>

    <!-- Bear Gradients -->
    <linearGradient id="bear-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B27A4B"/>
      <stop offset="100%" stop-color="#8C562B"/>
    </linearGradient>
    <linearGradient id="bear-snout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7D7B5"/>
      <stop offset="100%" stop-color="#E5BE93"/>
    </linearGradient>
    <linearGradient id="bear-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB8C6"/>
      <stop offset="100%" stop-color="#F88DA4"/>
    </linearGradient>

    <!-- Butterfly Gradients -->
    <linearGradient id="bf-top-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="50%" stop-color="#EE5253"/>
      <stop offset="100%" stop-color="#9C88FF"/>
    </linearGradient>
    <linearGradient id="bf-bot-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48DBFB"/>
      <stop offset="100%" stop-color="#10AC84"/>
    </linearGradient>

    <!-- Arrowhead Marker for Stroke Order Guide -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D63031"/>
    </marker>
  </defs>

  <!-- ===================================================
       1. BEACH BALL VECTOR ILLUSTRATION
       =================================================== -->
  <g id="illustration-ball" transform="translate(40, 40)">
    <!-- Shadow -->
    <ellipse cx="100" cy="175" rx="72" ry="14" fill="url(#soft-shadow)"/>
    <!-- Outer Ball Circle -->
    <circle cx="100" cy="95" r="75" fill="#FFFFFF" stroke="#2D3436" stroke-width="3"/>
    <!-- Panel 1 (Red) -->
    <path d="M100 20 A75 75 0 0 0 32 68 C60 80 84 128 100 170 Z" fill="url(#ball-red)"/>
    <!-- Panel 2 (Yellow) -->
    <path d="M100 20 C84 128 60 80 32 68 A75 75 0 0 0 48 140 C76 132 96 156 100 170 Z" fill="url(#ball-yellow)"/>
    <!-- Panel 3 (Blue) -->
    <path d="M100 20 C96 156 76 132 48 140 A75 75 0 0 0 120 165 C112 140 104 88 100 20 Z" fill="url(#ball-blue)"/>
    <!-- Panel 4 (Green) -->
    <path d="M100 20 C104 88 112 140 120 165 A75 75 0 0 0 168 95 C136 84 116 44 100 20 Z" fill="url(#ball-green)"/>
    <!-- Panel Seam Outlines -->
    <path d="M100 20 C70 64 60 120 100 170" fill="none" stroke="#2D3436" stroke-width="2.5"/>
    <path d="M100 20 C130 64 140 120 100 170" fill="none" stroke="#2D3436" stroke-width="2.5"/>
    <path d="M32 68 C70 100 130 100 168 95" fill="none" stroke="#2D3436" stroke-width="2.5"/>
    <!-- Top Cap -->
    <circle cx="100" cy="26" r="10" fill="#FFFFFF" stroke="#2D3436" stroke-width="2.2"/>
    <!-- Glossy Highlight Overlay -->
    <circle cx="100" cy="95" r="75" fill="url(#ball-shine)"/>
    <ellipse cx="70" cy="55" rx="16" ry="8" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 70 55)"/>
  </g>

  <!-- ===================================================
       2. CUTE BROWN BEAR VECTOR ILLUSTRATION
       =================================================== -->
  <g id="illustration-bear" transform="translate(300, 40)">
    <!-- Bear Shadow -->
    <ellipse cx="100" cy="176" rx="65" ry="13" fill="url(#soft-shadow)"/>
    <!-- Left Ear -->
    <circle cx="50" cy="42" r="24" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="50" cy="42" r="13" fill="url(#bear-pink)"/>
    <!-- Right Ear -->
    <circle cx="150" cy="42" r="24" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="150" cy="42" r="13" fill="url(#bear-pink)"/>
    <!-- Body -->
    <ellipse cx="100" cy="138" rx="50" ry="36" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="3"/>
    <!-- Belly Patch -->
    <ellipse cx="100" cy="142" rx="30" ry="22" fill="url(#bear-snout)"/>
    <!-- Head -->
    <ellipse cx="100" cy="85" rx="56" ry="48" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="3"/>
    <!-- Snout / Muzzle -->
    <ellipse cx="100" cy="98" rx="28" ry="20" fill="url(#bear-snout)" stroke="#2D3436" stroke-width="2.5"/>
    <!-- Nose -->
    <path d="M88 89 C88 82 112 82 112 89 C112 98 88 98 88 89 Z" fill="#2D3436"/>
    <ellipse cx="96" cy="87" rx="4" ry="2" fill="#FFFFFF" opacity="0.6"/>
    <!-- Mouth -->
    <path d="M100 95 V102 M90 102 Q100 110 110 102" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="74" cy="76" r="8" fill="#2D3436"/>
    <circle cx="77" cy="73" r="3" fill="#FFFFFF"/>
    <circle cx="126" cy="76" r="8" fill="#2D3436"/>
    <circle cx="129" cy="73" r="3" fill="#FFFFFF"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="60" cy="92" rx="9" ry="6" fill="url(#bear-pink)" opacity="0.6"/>
    <ellipse cx="140" cy="92" rx="9" ry="6" fill="url(#bear-pink)" opacity="0.6"/>
    <!-- Paws -->
    <ellipse cx="56" cy="146" rx="14" ry="10" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="2.5"/>
    <ellipse cx="144" cy="146" rx="14" ry="10" fill="url(#bear-fur)" stroke="#2D3436" stroke-width="2.5"/>
    <circle cx="56" cy="146" r="6" fill="url(#bear-snout)"/>
    <circle cx="144" cy="146" r="6" fill="url(#bear-snout)"/>
  </g>

  <!-- ===================================================
       3. BUTTERFLY VECTOR ILLUSTRATION
       =================================================== -->
  <g id="illustration-butterfly" transform="translate(560, 40)">
    <!-- Left Upper Wing -->
    <path d="M92 75 C70 30 20 20 15 60 C10 88 64 105 92 88 Z" fill="url(#bf-top-wing)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="44" cy="52" r="12" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="44" cy="52" r="6" fill="#EE5253"/>
    <circle cx="30" cy="72" r="6" fill="#FFFFFF" opacity="0.85"/>

    <!-- Right Upper Wing -->
    <path d="M108 75 C130 30 180 20 185 60 C190 88 136 105 108 88 Z" fill="url(#bf-top-wing)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="156" cy="52" r="12" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="156" cy="52" r="6" fill="#EE5253"/>
    <circle cx="170" cy="72" r="6" fill="#FFFFFF" opacity="0.85"/>

    <!-- Left Lower Wing -->
    <path d="M94 92 C64 100 28 124 48 156 C68 180 96 130 98 104 Z" fill="url(#bf-bot-wing)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="64" cy="136" r="8" fill="#FFEAA7"/>

    <!-- Right Lower Wing -->
    <path d="M106 92 C136 100 172 124 152 156 C132 180 104 130 102 104 Z" fill="url(#bf-bot-wing)" stroke="#2D3436" stroke-width="3"/>
    <circle cx="136" cy="136" r="8" fill="#FFEAA7"/>

    <!-- Body -->
    <ellipse cx="100" cy="96" rx="9" ry="40" fill="#2D3436"/>
    <line x1="93" y1="72" x2="107" y2="72" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
    <line x1="93" y1="84" x2="107" y2="84" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
    <line x1="93" y1="96" x2="107" y2="96" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
    <line x1="93" y1="108" x2="107" y2="108" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>

    <!-- Head -->
    <circle cx="100" cy="52" r="11" fill="#2D3436"/>
    <circle cx="96" cy="50" r="2.5" fill="#FFFFFF"/>
    <circle cx="104" cy="50" r="2.5" fill="#FFFFFF"/>

    <!-- Antennae -->
    <path d="M96 44 Q84 24 72 20" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="20" r="5" fill="#EE5253"/>

    <path d="M104 44 Q116 24 128 20" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="20" r="5" fill="#EE5253"/>
  </g>

  <!-- ===================================================
       4. HERO FORMATION GRAPHIC FOR UPPERCASE B
       =================================================== -->
  <g id="stroke-formation-b" transform="translate(150, 320)">
    <!-- Guideline Box -->
    <rect x="0" y="0" width="500" height="220" fill="#FAFCFE" rx="16" stroke="#D0E1F9" stroke-width="2.5"/>
    
    <!-- Top Guideline -->
    <line x1="20" y1="35" x2="480" y2="35" stroke="#74B9FF" stroke-width="2"/>
    <text x="485" y="39" font-family="'Nunito', sans-serif" font-size="14" fill="#0984E3" font-weight="700">Top Line</text>

    <!-- Dashed Midline -->
    <line x1="20" y1="110" x2="480" y2="110" stroke="#0984E3" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="485" y="114" font-family="'Nunito', sans-serif" font-size="14" fill="#0984E3" font-weight="700">Mid Line</text>

    <!-- Bottom Baseline -->
    <line x1="20" y1="185" x2="480" y2="185" stroke="#2D3436" stroke-width="3.5"/>
    <text x="485" y="189" font-family="'Nunito', sans-serif" font-size="14" fill="#2D3436" font-weight="800">Baseline</text>

    <!-- Formated Letter B Illustration -->
    <g transform="translate(180, 0)">
      <!-- Stroke 1 (Vertical) -->
      <path d="M40 35 V185" fill="none" stroke="#D0E1F9" stroke-width="22" stroke-linecap="round"/>
      <path d="M40 35 V185" fill="none" stroke="#0984E3" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>

      <!-- Stroke 2 (Top Loop) -->
      <path d="M40 35 H100 C140 35 140 110 100 110 H40" fill="none" stroke="#D0E1F9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 35 H100 C140 35 140 110 100 110 H40" fill="none" stroke="#FF7675" stroke-width="4" stroke-dasharray="8 6"/>

      <!-- Stroke 3 (Bottom Loop) -->
      <path d="M40 110 H110 C155 110 155 185 105 185 H40" fill="none" stroke="#D0E1F9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 110 H110 C155 110 155 185 105 185 H40" fill="none" stroke="#1DD1A1" stroke-width="4" stroke-dasharray="8 6"/>

      <!-- Dot 1 -->
      <circle cx="40" cy="35" r="11" fill="#D63031"/>
      <text x="40" y="41" font-family="'Fredoka', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

      <!-- Dot 2 -->
      <circle cx="65" cy="35" r="11" fill="#FF7675"/>
      <text x="65" y="41" font-family="'Fredoka', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

      <!-- Dot 3 -->
      <circle cx="65" cy="110" r="11" fill="#1DD1A1"/>
      <text x="65" y="116" font-family="'Fredoka', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>
  </g>
</svg>
