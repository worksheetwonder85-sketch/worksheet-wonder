<!-- 
  COMPONENT: Hero Section (Look)
  PURPOSE: Introduces the primary subject matter (Letter, Number, Shape, etc.)
  DATA BINDING: Accepts any primary string via {{HERO_CONTENT}}
-->
<section class="hero panel scaffold col-6">
  <h2 class="section-heading t-heading text-center">Look</h2>
  <div class="hero-content flex justify-center items-center" style="height: 100%;">
    <!-- Displays the target subject (e.g. "Aa", "10", or a geometric shape) -->
    <span class="hero-text t-title" style="font-size: 72pt;">{{HERO_CONTENT}}</span>
  </div>
</section>
