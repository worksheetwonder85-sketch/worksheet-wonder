<!-- 
  COMPONENT: Vocabulary / Context (Say)
  PURPOSE: Connects the abstract subject to concrete examples.
  MODULARITY: Works for 3 phonics words, 3 shapes, 3 sight words, or 3 math equations.
-->
<section class="vocabulary-context panel col-12">
  <h2 class="section-heading t-heading text-center mb-sm">Say</h2>
  <!-- Container for the 3 vector illustrations -->
  <div class="illustrations-row flex justify-around items-center">
    <div class="svg-container card-illustration">
      {{{SVG1}}}
    </div>
    <div class="svg-container card-illustration">
      {{{SVG2}}}
    </div>
    <div class="svg-container card-illustration">
      {{{SVG3}}}
    </div>
  </div>

  <!-- Container for the 3 associated words/captions -->
  <div class="vocabulary-row flex justify-around mt-sm">
    <div class="word-box text-center"><span class="vocab-word t-vocab">{{WORD1}}</span></div>
    <div class="word-box text-center"><span class="vocab-word t-vocab">{{WORD2}}</span></div>
    <div class="word-box text-center"><span class="vocab-word t-vocab">{{WORD3}}</span></div>
  </div>
</section>
