<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Worksheet Wonder â€” Hero Banner Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap');
    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }
    .hero-banner {
      width: 1920px;
      height: 600px;
      background: #ffffff;
      border-bottom: 4px solid #333333;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 120px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .hero-content {
      max-width: 800px;
      z-index: 10;
    }
    .hero-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 54pt;
      margin: 0 0 20px 0;
      color: #333333;
      line-height: 1.1;
    }
    .hero-desc {
      font-size: 20pt;
      color: #666666;
      margin: 0 0 40px 0;
      line-height: 1.5;
    }
    .hero-buttons {
      display: flex;
      gap: 20px;
    }
    .primary-btn {
      background: #333333;
      color: #ffffff;
      border: none;
      padding: 18px 40px;
      border-radius: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16pt;
      cursor: pointer;
      box-shadow: 4px 4px 0px #888888;
    }
    .secondary-btn {
      background: #ffffff;
      color: #333333;
      border: 3px solid #333333;
      padding: 15px 36px;
      border-radius: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16pt;
      cursor: pointer;
      box-shadow: 4px 4px 0px #333333;
    }
    .banner-graphic {
      position: absolute;
      right: 120px;
      top: 50%;
      transform: translateY(-50%);
      width: 600px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="hero-banner">
    <div class="hero-content">
      <h1 class="hero-title">{{HERO_TITLE}}</h1>
      <p class="hero-desc">{{HERO_DESCRIPTION}}</p>
      <div class="hero-buttons">
        <button class="primary-btn">Browse Curriculum</button>
        <button class="secondary-btn">Free Samples</button>
      </div>
    </div>
    <div class="banner-graphic">
      <!-- Mascot / Bundle Cluster Illustration -->
      <svg width="500" height="400" viewBox="0 0 100 80" fill="none" stroke="#333333" stroke-width="1.5">
        <!-- Multiple Sheets overlapping -->
        <g transform="translate(10, 5) rotate(-5)">
          <rect x="0" y="0" width="45" height="60" rx="3" fill="#ffffff" />
          <line x1="8" y1="12" x2="37" y2="12" stroke-width="2.5" />
          <circle cx="22.5" cy="35" r="10" />
        </g>
        <g transform="translate(45, 10) rotate(5)">
          <rect x="0" y="0" width="45" height="60" rx="3" fill="#ffffff" stroke-width="2" />
          <line x1="8" y1="12" x2="37" y2="12" stroke-width="3" />
          <polygon points="22.5 28 25.5 35 33 35 27 40 29 48 22.5 43 16 48 18 40 12 35 19.5 35" fill="#333333" />
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
