<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Worksheet Wonder â€” Bundle Cover Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap');
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 210mm; height: 297mm;
      font-family: 'Nunito', sans-serif;
      color: #333333; background: #ffffff;
      -webkit-print-color-adjust: exact;
    }
    .cover-container {
      width: 210mm; height: 297mm;
      padding: 20mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    .page-borders {
      position: absolute;
      top: 0; left: 0;
      width: 210mm; height: 297mm;
      pointer-events: none;
    }
    .outer-border { fill: none; stroke: #333333; stroke-width: 0.8mm; }
    .inner-border { fill: none; stroke: #333333; stroke-width: 0.4mm; }
    .header-info {
      text-align: center;
      width: 100%;
    }
    .brand-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 20pt;
      font-weight: 600;
      margin-bottom: 5mm;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3mm;
    }
    .badge-container {
      display: flex;
      justify-content: center;
      gap: 4mm;
      margin-top: 4mm;
    }
    .badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 10pt;
      font-weight: 600;
      border: 0.4mm solid #333333;
      border-radius: 4mm;
      padding: 1.5mm 4mm;
      background: #ffffff;
      text-transform: uppercase;
    }
    .badge.difficulty { background: #f0f0f0; }
    .title-block {
      text-align: center;
      max-width: 150mm;
      margin-top: 15mm;
    }
    .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 36pt;
      font-weight: 600;
      margin: 0 0 5mm 0;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 16pt;
      color: #666666;
      margin: 0;
    }
    .graphic-area {
      flex-grow: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10mm 0;
    }
    .footer-bar {
      text-align: center;
      width: 100%;
    }
    .page-count {
      font-family: 'Fredoka', sans-serif;
      font-size: 14pt;
      font-weight: 600;
      margin-bottom: 5mm;
    }
    .legal-note {
      font-size: 8pt;
      color: #888888;
    }
  </style>
</head>
<body>
  <svg class="page-borders" viewBox="0 0 210 297" preserveAspectRatio="none">
    <rect x="4" y="4" width="202" height="289" rx="8" ry="8" class="outer-border" />
    <rect x="8" y="8" width="194" height="281" rx="6" ry="6" class="inner-border" />
  </svg>
  <div class="cover-container">
    <div class="header-info">
      <div class="brand-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        Worksheet Wonder
      </div>
      <div class="badge-container">
        <div class="badge grade">{{GRADE_LEVEL}}</div>
        <div class="badge subject">{{SUBJECT}}</div>
        <div class="badge difficulty">{{DIFFICULTY}}</div>
      </div>
    </div>
    <div class="title-block">
      <h1 class="title">{{BUNDLE_TITLE}}</h1>
      <p class="subtitle">{{BUNDLE_SUBTITLE}}</p>
    </div>
    <div class="graphic-area">
      <!-- Main Bundle Icon -->
      <svg width="180" height="180" viewBox="0 0 100 100" fill="none" stroke="#333333" stroke-width="2">
        <polygon points="50 5 62 38 95 38 68 58 78 95 50 72 22 95 32 58 5 38 38 38" />
        <circle cx="50" cy="52" r="14" />
      </svg>
    </div>
    <div class="footer-bar">
      <div class="page-count">{{PAGE_COUNT}} Educational Pages</div>
      <div class="legal-note">Â© 2026 Worksheet Wonder. All Rights Reserved. Printable PDF Bundle.</div>
    </div>
  </div>
</body>
</html>
