<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Worksheet Wonder â€” Featured Product Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap');
    body {
      margin: 0;
      padding: 40px;
      background-color: #f5f5f5;
      font-family: 'Nunito', sans-serif;
    }
    .featured-container {
      width: 800px;
      height: 400px;
      background: #ffffff;
      border: 3px solid #333333;
      border-radius: 16px;
      box-shadow: 8px 8px 0px #333333;
      display: flex;
      overflow: hidden;
    }
    .cover-pane {
      width: 320px;
      background: #fafafa;
      border-right: 3px solid #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .info-pane {
      flex-grow: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .featured-badge {
      background: #f0f0f0;
      border: 1.5px solid #333333;
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 8.5pt;
      font-weight: 600;
      text-transform: uppercase;
      align-self: flex-start;
      margin-bottom: 10px;
    }
    .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 22pt;
      margin: 0 0 10px 0;
      color: #333333;
      line-height: 1.2;
    }
    .benefits-list {
      margin: 0 0 20px 0;
      padding-left: 20px;
      font-size: 11pt;
      color: #555555;
      line-height: 1.6;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .price-block {
      display: flex;
      flex-direction: column;
    }
    .price-label {
      font-size: 9pt;
      color: #888888;
      text-transform: uppercase;
    }
    .price-val {
      font-family: 'Fredoka', sans-serif;
      font-size: 24pt;
      color: #333333;
    }
    .buy-btn {
      background: #333333;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-family: 'Fredoka', sans-serif;
      font-size: 11pt;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 3px 3px 0px #888888;
    }
  </style>
</head>
<body>
  <div class="featured-container">
    <div class="cover-pane">
      <svg width="180" height="240" viewBox="0 0 80 100" fill="none" stroke="#333333" stroke-width="2">
        <rect x="2" y="2" width="76" height="96" rx="4" />
        <rect x="8" y="8" width="64" height="84" rx="2" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="16" y1="20" x2="64" y2="20" stroke-width="3.5" />
        <circle cx="40" cy="54" r="16" />
        <polygon points="40 44 43 51 51 51 45 56 47 64 40 59 33 64 35 56 29 51 37 51" fill="#333333" />
      </svg>
    </div>
    <div class="info-pane">
      <div>
        <div class="featured-badge">Featured Resource</div>
        <h2 class="title">{{BUNDLE_TITLE}}</h2>
        <ul class="benefits-list">
          <li>{{BENEFIT_1}}</li>
          <li>{{BENEFIT_2}}</li>
          <li>{{BENEFIT_3}}</li>
        </ul>
      </div>
      <div class="action-row">
        <div class="price-block">
          <span class="price-label">Instant PDF</span>
          <span class="price-val">${{PRICE}}</span>
        </div>
        <button class="buy-btn">Download Bundle</button>
      </div>
    </div>
  </div>
</body>
</html>
