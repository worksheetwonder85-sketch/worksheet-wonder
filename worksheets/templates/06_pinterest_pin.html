<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Worksheet Wonder â€” Pinterest Pin Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700;800&display=swap');
    body {
      margin: 0;
      padding: 0;
      width: 1000px;
      height: 1500px;
      background: #ffffff;
      box-sizing: border-box;
      border: 24px solid #333333;
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
    }
    .header {
      text-align: center;
    }
    .logo-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 28pt;
      color: #333333;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .hook-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 48pt;
      line-height: 1.1;
      margin: 0;
      color: #333333;
    }
    .mockup-area {
      flex-grow: 1;
      margin: 40px 0;
      background: #fafafa;
      border: 3px dashed #cccccc;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .cta-area {
      text-align: center;
    }
    .grade-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 20pt;
      background: #ffffff;
      border: 3px solid #333333;
      padding: 10px 30px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 30px;
    }
    .cta-btn {
      background: #333333;
      color: #ffffff;
      border: none;
      padding: 20px 60px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 24pt;
      cursor: pointer;
      box-shadow: 6px 6px 0px #888888;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-text">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      Worksheet Wonder
    </div>
    <h1 class="hook-text">{{PIN_TEXT_HOOK}}</h1>
  </div>
  <div class="mockup-area">
    <!-- Center Mockup SVG -->
    <svg width="400" height="500" viewBox="0 0 100 120" fill="none" stroke="#333333" stroke-width="2">
      <rect x="2" y="2" width="96" height="116" rx="4" fill="#ffffff" />
      <line x1="16" y1="20" x2="84" y2="20" stroke-width="4" />
      <line x1="20" y1="40" x2="80" y2="40" />
      <line x1="20" y1="52" x2="80" y2="52" />
      <line x1="20" y1="64" x2="80" y2="64" />
      <circle cx="50" cy="94" r="12" />
    </svg>
  </div>
  <div class="cta-area">
    <div class="grade-badge">{{GRADE_LEVEL}}</div>
    <div>
      <button class="cta-btn">Get Free PDF</button>
    </div>
  </div>
</body>
</html>
