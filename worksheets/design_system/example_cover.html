<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap');
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 210mm; height: 297mm;
      font-family: 'Nunito', sans-serif;
      color: #333333; background: #ffffff;
      -webkit-print-color-adjust: exact;
    }
    .cover-container {
      width: 210mm; height: 297mm;
      padding: 20mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    .page-borders {
      position: absolute;
      top: 0; left: 0;
      width: 210mm; height: 297mm;
      pointer-events: none;
      z-index: 100;
    }
    .outer-border { fill: none; stroke: #333333; stroke-width: 0.8mm; }
    .inner-border { fill: none; stroke: #333333; stroke-width: 0.4mm; }
    .header-bar {
      text-align: center;
      width: 100%;
    }
    .brand-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 22pt;
      font-weight: 600;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 4mm;
      margin-top: 5mm;
    }
    .badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 10pt;
      font-weight: 600;
      border: 0.4mm solid #333333;
      border-radius: 4mm;
      padding: 1.5mm 4mm;
      background: #ffffff;
      text-transform: uppercase;
    }
    .badge.difficulty { background: #f0f0f0; }
    .title-block {
      text-align: center;
      margin-top: 15mm;
    }
    .title {
      font-family: 'Fredoka', sans-serif;
      font-size: 38pt;
      margin: 0 0 5mm 0;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 16pt;
      color: #666666;
      margin: 0;
    }
    .graphic-area {
      flex-grow: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .footer-bar {
      text-align: center;
      width: 100%;
    }
    .page-count {
      font-family: 'Fredoka', sans-serif;
      font-size: 14pt;
      font-weight: 600;
      margin-bottom: 5mm;
    }
    .legal-note {
      font-size: 8pt;
      color: #888888;
    }
  </style>
</head>
<body>
  <svg class="page-borders" viewBox="0 0 210 297" preserveAspectRatio="none">
    <rect x="4" y="4" width="202" height="289" rx="8" ry="8" class="outer-border" />

    <div class="title-block">
      <h1 class="title">Adding to 10 Activities</h1>
      <p class="subtitle">Complete Elementary Math Practice Worksheets</p>
    </div>
    <div class="graphic-area">
      <!-- Mascot Outline SVG -->
      <svg width="180" height="180" viewBox="0 0 100 100" fill="none" stroke="#333333" stroke-width="2">
        <polygon points="50 5 62 38 95 38 68 58 78 95 50 72 22 95 32 58 5 38 38 38" />
        <circle cx="50" cy="52" r="14" fill="#fafafa" />

        <circle cx="55" cy="48" r="1.5" fill="#333" />

  </div>

</html>
