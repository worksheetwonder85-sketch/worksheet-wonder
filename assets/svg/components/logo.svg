<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Worksheet Wonder Logo Mark
       A stylized "W" formed by two overlapping pencils
       with a radiating star/sparkle at the junction point.
       Original design — no copyrighted elements. -->

  <!-- Left pencil stroke -->
  <path d="M 40 155 L 75 55 L 100 130"
        fill="none" stroke="#1A1A2E" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right pencil stroke -->
  <path d="M 100 130 L 125 55 L 160 155"
        fill="none" stroke="#1A1A2E" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pencil tip left -->
  <polygon points="70,65 75,45 80,65" fill="#FFCA28" stroke="#1A1A2E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Pencil tip right -->
  <polygon points="120,65 125,45 130,65" fill="#42A5F5" stroke="#1A1A2E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Central sparkle / wonder star -->
  <g transform="translate(100,100)">
    <!-- 4-point sparkle -->
    <path d="M 0 -18 Q 3 -3, 18 0 Q 3 3, 0 18 Q -3 3, -18 0 Q -3 -3, 0 -18 Z"
          fill="#EF5350" stroke="#1A1A2E" stroke-width="3"/>
    <!-- Small radiating dots -->
    <circle cx="16" cy="-16" r="3" fill="#FFCA28"/>
    <circle cx="-16" cy="-16" r="2.5" fill="#66BB6A"/>
    <circle cx="16" cy="16" r="2" fill="#AB47BC"/>
    <circle cx="-16" cy="16" r="2.5" fill="#42A5F5"/>
  </g>

  <!-- Rainbow arc above the W -->
  <path d="M 50 60 Q 100 20, 150 60"
        fill="none" stroke="url(#logo-rainbow)" stroke-width="6"
        stroke-linecap="round"/>

  <defs>
    <linearGradient id="logo-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#EF5350"/>
      <stop offset="16%"  stop-color="#FF9800"/>
      <stop offset="33%"  stop-color="#FFCA28"/>
      <stop offset="50%"  stop-color="#66BB6A"/>
      <stop offset="66%"  stop-color="#42A5F5"/>
      <stop offset="83%"  stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#AB47BC"/>
    </linearGradient>
  </defs>
</svg>
